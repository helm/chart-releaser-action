name: test-chart-releaser

on:
  pull_request:

permissions: {}

jobs:

  test_explicit_charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate explicit chart processing
        run: bash .github/scripts/test-explicit-charts.sh
      - name: Validate replacement publishing modes
        run: bash .github/scripts/test-replacement.sh

  test_chart_releaser_install_action:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    name: Install chart-releaser and test presence in path
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install chart-releaser
      uses: ./
      with:
        install_only: true
      env:
        CR_TOKEN: "FAKE_SECRETS"
    - name: Check install!
      run: |
        cr version
        CR_VERSION_OUTPUT=$(cr version 2>&1 /dev/null)
        ACTUAL_VERSION=$(echo "$CR_VERSION_OUTPUT" | grep GitVersion | rev | cut -d ' ' -f1 | rev)
        if [[ $ACTUAL_VERSION != 'v1.10.0' ]]; then
          echo 'should be v1.10.0'
          exit 1
        else
          exit 0
        fi
      shell: bash
    - name: Check root directory
      run: |
        if ! git diff --stat --exit-code; then
          echo 'should be clean'
          exit 1
        fi

  test_chart_releaser_action:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    name: Install chart-releaser and run it
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install chart-releaser
      uses: ./
      env:
        CR_TOKEN: "FAKE_SECRETS"
    - name: Check root directory
      run: |
        if ! git diff --stat --exit-code; then
          echo 'should be clean'
          exit 1
        fi
  test_chart_version_output:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    name: Validate chart_version output
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Helm for package fixtures
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.14.3
    - name: Validate chart_version output
      run: bash .github/scripts/test-chart-version-output.sh
      shell: bash
